<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WOODY — AI Assistant Overlay</title>
  <meta name="description" content="WOODY AI Assistant — Apple Intelligence inspired liquid glass interface." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════════════════════════════════════════
       WOODY OVERLAY — Apple Intelligence Liquid Glass Edition
       Springs · Materials · Iridescent Glow · Depth · Apple UI Refraction
       ═══════════════════════════════════════════════════════════════════════════ */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* ── Springs ── */
      --spring-default: cubic-bezier(0.22, 1, 0.36, 1);
      --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --spring-snappy: cubic-bezier(0.16, 1, 0.3, 1);
      --spring-gentle: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --dur-instant: 60ms;
      --dur-fast: 120ms;
      --dur-normal: 280ms;
      --dur-slow: 420ms;

      /* ── Apple Glass Palette ── */
      --glass-dark: rgba(14, 14, 24, 0.45);
      --glass-card: rgba(30, 30, 46, 0.35);
      --glass-pill: rgba(40, 40, 60, 0.30);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-border-hover: rgba(255, 255, 255, 0.35);
      --glass-shine: rgba(255, 255, 255, 0.20);

      /* ── Spectrum Accent Tokens ── */
      --apple-cyan: #38bdf8;
      --apple-indigo: #6366f1;
      --apple-violet: #a855f7;
      --apple-pink: #ec4899;
      --apple-amber: #fbbf24;
      --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.15), 0 0 80px rgba(168, 85, 247, 0.10);

      /* ── Real-Time Dynamic Voice Gradient Tokens ── */
      --voice-primary: #6366f1;
      --voice-secondary: #a855f7;
      --voice-tertiary: #38bdf8;
      --voice-primary-rgb: 99, 102, 241;
      --voice-secondary-rgb: 168, 85, 247;
      --voice-tertiary-rgb: 56, 189, 248;
      --voice-glow-radius: 40px;
      --voice-energy: 0;

      /* ── Text ── */
      --text-primary: rgba(255, 255, 255, 0.96);
      --text-secondary: rgba(255, 255, 255, 0.65);
      --text-tertiary: rgba(255, 255, 255, 0.35);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      font-optical-sizing: auto;
    }

    /* ═══════════════════════════════════════════════════════════════
       LIQUID GLASS — real-time lensing + pointer-reactive specular
       highlights (Apple Intelligence Edition)
       ═══════════════════════════════════════════════════════════════ */
    @supports ((backdrop-filter: url(#glass-lens)) or (-webkit-backdrop-filter: url(#glass-lens))) {
      #overlay {
        backdrop-filter: url(#glass-lens) blur(70px) saturate(200%);
        -webkit-backdrop-filter: url(#glass-lens) blur(70px) saturate(200%);
      }

      .input-bar {
        backdrop-filter: url(#glass-lens) blur(40px) saturate(180%);
        -webkit-backdrop-filter: url(#glass-lens) blur(40px) saturate(180%);
      }
    }

    #overlay,
    .input-bar,
    .status-pill,
    .close-btn {
      position: relative;
    }

    .specular-layer {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle 240px at var(--sx, 50%) var(--sy, 0%),
          rgba(255, 255, 255, 0.35), rgba(168, 85, 247, 0.15) 35%,
          rgba(56, 189, 248, 0.08) 60%, transparent 80%);
      opacity: 0;
      transition: opacity var(--dur-normal) ease;
      pointer-events: none;
      mix-blend-mode: overlay;
      z-index: 3;
    }

    .specular-layer.specular-hover {
      opacity: 1;
    }

    .specular-layer.specular-press {
      opacity: 1;
      transition: opacity var(--dur-instant) ease-out;
      background: radial-gradient(circle 180px at var(--sx, 50%) var(--sy, 50%),
          rgba(255, 255, 255, 0.50), rgba(236, 72, 153, 0.20) 40%,
          rgba(99, 102, 241, 0.10) 65%, transparent 80%);
    }

    @media (prefers-reduced-motion: reduce) {
      .specular-layer {
        transition: none;
      }
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       REDUCED MOTION / TRANSPARENCY
       ═══════════════════════════════════════════════════════════════════════════ */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 180ms !important;
        transition-timing-function: ease !important;
      }

      #aurora-canvas {
        display: none !important;
      }
    }

    @media (prefers-reduced-transparency: reduce) {
      #overlay {
        background: rgba(14, 14, 22, 0.98) !important;
        backdrop-filter: none !important;
      }

      .input-bar {
        background: rgba(30, 30, 44, 0.98) !important;
        backdrop-filter: none !important;
      }
    }

    /* ═══════════════════════════════════════════════════════════════
       OVERLAY BACKDROP — Fullscreen frosted dark glass with light rim
       ═══════════════════════════════════════════════════════════════ */

    #overlay {
      position: fixed;
      inset: 0;
      background: var(--glass-dark);
      backdrop-filter: blur(70px) saturate(200%);
      -webkit-backdrop-filter: blur(70px) saturate(200%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      opacity: 0;
      cursor: default;
      touch-action: none;
    }

    #overlay.hidden {
      pointer-events: none;
    }

    /* Ambient reactive spectrum aura — smoothly expands and morphs with voice */
    #overlay::before {
      content: '';
      position: absolute;
      width: calc(660px + var(--voice-energy, 0) * 240px);
      height: calc(660px + var(--voice-energy, 0) * 240px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -58%);
      border-radius: 50%;
      background: radial-gradient(ellipse,
        rgba(var(--voice-primary-rgb), calc(0.16 + var(--voice-energy, 0) * 0.22)) 0%,
        rgba(var(--voice-secondary-rgb), calc(0.08 + var(--voice-energy, 0) * 0.16)) 38%,
        rgba(var(--voice-tertiary-rgb), 0.03) 65%,
        transparent 75%
      );
      pointer-events: none;
      transition: width 0.2s ease-out, height 0.2s ease-out, background 0.3s ease-out;
      filter: blur(30px);
    }

    /* Apple Intelligence Glowing Perimeter Rim */
    #overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow:
        inset 0 0 calc(50px + var(--voice-energy, 0) * 70px) rgba(var(--voice-primary-rgb), calc(0.12 + var(--voice-energy, 0) * 0.25)),
        inset 0 0 120px rgba(var(--voice-secondary-rgb), calc(0.06 + var(--voice-energy, 0) * 0.15));
      opacity: 0.85;
      transition: box-shadow 0.2s ease-out;
      z-index: 1;
    }

    /* State-reactive ambient spectrum transitions */
    #overlay.state-listening::before {
      background: radial-gradient(ellipse,
        rgba(var(--voice-primary-rgb), calc(0.24 + var(--voice-energy, 0) * 0.25)) 0%,
        rgba(var(--voice-secondary-rgb), calc(0.16 + var(--voice-energy, 0) * 0.18)) 35%,
        rgba(var(--voice-tertiary-rgb), 0.08) 60%,
        transparent 75%);
    }

    #overlay.state-thinking::before {
      background: radial-gradient(ellipse, rgba(251, 191, 36, 0.22) 0%, rgba(245, 158, 11, 0.10) 45%, transparent 70%);
    }

    #overlay.state-speaking::before {
      background: radial-gradient(ellipse,
        rgba(var(--voice-primary-rgb), calc(0.26 + var(--voice-energy, 0) * 0.22)) 0%,
        rgba(var(--voice-secondary-rgb), calc(0.15 + var(--voice-energy, 0) * 0.15)) 45%,
        transparent 70%);
    }

    /* ═══════════════════════════════════════════════════════════════
       TOP BAR
       ═══════════════════════════════════════════════════════════════ */

    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      z-index: 2;
    }

    .top-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(-12px);
      transition: all var(--dur-slow) var(--spring-default) 0.12s;
    }

    #overlay.visible .top-brand {
      opacity: 1;
      transform: translateY(0);
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--voice-tertiary, #38bdf8), var(--voice-secondary, #a855f7));
      box-shadow: 0 0 14px rgba(var(--voice-primary-rgb), 0.7);
      transition: all 0.3s ease;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.92);
      letter-spacing: -0.025em;
    }

    .close-btn {
      opacity: 0;
      transform: translateY(-12px);
      transition: all var(--dur-slow) var(--spring-default) 0.12s;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      backdrop-filter: blur(12px);
    }

    #overlay.visible .close-btn {
      opacity: 1;
      transform: translateY(0);
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: var(--text-primary);
      border-color: var(--glass-border-hover);
    }

    .close-btn:active {
      transform: scale(0.88);
      transition: transform var(--dur-instant) ease-out;
    }

    .top-action-btn {
      opacity: 0;
      transform: translateY(-12px);
      transition: all var(--dur-slow) var(--spring-default) 0.12s;
      height: 32px;
      padding: 0 12px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 550;
      font-family: inherit;
      backdrop-filter: blur(12px);
      user-select: none;
    }

    #overlay.visible .top-action-btn {
      opacity: 1;
      transform: translateY(0);
    }

    .top-action-btn:hover {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.28), rgba(168, 85, 247, 0.28));
      color: #ffffff;
      border-color: rgba(168, 85, 247, 0.5);
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.35);
      transform: translateY(-1px);
    }

    .top-action-btn:active {
      transform: scale(0.92);
      transition: transform var(--dur-instant) ease-out;
    }

    /* ═══════════════════════════════════════════════════════════════
       STATUS CAPSULE (Apple Intelligence Glass Pill)
       ═══════════════════════════════════════════════════════════════ */

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      border-radius: 9999px;
      background: linear-gradient(135deg, rgba(var(--voice-primary-rgb), 0.18), rgba(var(--voice-secondary-rgb), 0.08));
      border: 1px solid rgba(var(--voice-primary-rgb), 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      margin-bottom: 16px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity var(--dur-slow) var(--spring-default) 0.18s,
                  transform var(--dur-slow) var(--spring-default) 0.18s,
                  background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), 0 0 calc(20px + var(--voice-energy, 0) * 30px) rgba(var(--voice-primary-rgb), calc(0.2 + var(--voice-energy, 0) * 0.35));
    }

    #overlay.visible .status-pill {
      opacity: 1;
      transform: translateY(0);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--voice-primary, #818cf8);
      transition: all var(--dur-normal) ease;
      box-shadow: 0 0 12px rgba(var(--voice-primary-rgb), 0.8);
    }

    .status-dot.listening {
      background: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.9), 0 0 28px rgba(168, 85, 247, 0.6);
      animation: statusPulse 1.4s ease-in-out infinite;
    }

    .status-dot.thinking {
      background: #fbbf24;
      box-shadow: 0 0 14px rgba(251, 191, 36, 0.8), 0 0 24px rgba(245, 158, 11, 0.5);
      animation: statusPulse 1s ease-in-out infinite;
    }

    .status-dot.speaking {
      background: #a855f7;
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.9), 0 0 28px rgba(236, 72, 153, 0.6);
    }

    @keyframes statusPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.42); opacity: 0.6; }
    }

    .status-text {
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.92);
      letter-spacing: 0.015em;
    }

    /* ═══════════════════════════════════════════════════════════════
       AURORA VISUALIZER
       ═══════════════════════════════════════════════════════════════ */

    #aurora-container {
      position: relative;
      width: 540px;
      height: 130px;
      margin-bottom: 20px;
      opacity: 0;
      transform: scale(0.95);
      transition: all var(--dur-slow) var(--spring-bounce) 0.22s;
    }

    #overlay.visible #aurora-container {
      opacity: 1;
      transform: scale(1);
    }

    #aurora-canvas {
      width: 100%;
      height: 100%;
      will-change: transform;
      filter: drop-shadow(0 0 calc(12px + var(--voice-energy, 0) * 20px) rgba(var(--voice-primary-rgb), 0.45));
    }

    /* ═══════════════════════════════════════════════════════════════
       CAPTION AREA
       ═══════════════════════════════════════════════════════════════ */

    .caption-area {
      max-width: 520px;
      text-align: center;
      margin-bottom: 20px;
      min-height: 26px;
      opacity: 0;
      transform: translateY(8px);
      transition: all var(--dur-slow) var(--spring-default) 0.28s;
    }

    #overlay.visible .caption-area {
      opacity: 1;
      transform: translateY(0);
    }

    .caption-text {
      font-size: 15px;
      line-height: 1.6;
      letter-spacing: 0;
      color: rgba(255, 255, 255, 0.94);
      font-weight: 400;
    }

    /* ═══════════════════════════════════════════════════════════════
       INPUT BAR (Apple Liquid Glass Input + Mic Integration)
       ═══════════════════════════════════════════════════════════════ */

    .input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 540px;
      max-width: 90vw;
      padding: 5px 6px 5px 18px;
      background: var(--glass-card);
      border: 1px solid rgba(var(--voice-primary-rgb), calc(0.2 + var(--voice-energy, 0) * 0.35));
      border-radius: 20px;
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      box-shadow: inset 0 1.5px 0 var(--glass-shine),
        0 8px 32px rgba(0, 0, 0, 0.45),
        0 0 calc(16px + var(--voice-energy, 0) * 32px) rgba(var(--voice-primary-rgb), calc(0.1 + var(--voice-energy, 0) * 0.3));
      opacity: 0;
      transform: translateY(16px);
      transition: all var(--dur-slow) var(--spring-default) 0.32s,
                  border-color 0.25s ease, box-shadow 0.25s ease;
    }

    #overlay.visible .input-bar {
      opacity: 1;
      transform: translateY(0);
    }

    .input-bar:focus-within {
      background: rgba(35, 35, 55, 0.55);
      border-color: rgba(var(--voice-secondary-rgb), 0.7);
      box-shadow: 0 0 0 2.5px rgba(var(--voice-primary-rgb), 0.35),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.3),
        0 14px 40px rgba(0, 0, 0, 0.6),
        0 0 35px rgba(var(--voice-primary-rgb), 0.45);
    }

    .input-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.96);
      font-family: inherit;
      font-size: 14.5px;
      outline: none;
      caret-color: var(--voice-tertiary, #38bdf8);
    }

    .input-bar input::placeholder {
      color: var(--text-tertiary);
    }

    /* Microphone button */
    .input-mic-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--dur-fast) var(--spring-default);
      flex-shrink: 0;
      position: relative;
    }

    .input-mic-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: var(--text-primary);
      border-color: rgba(var(--voice-primary-rgb), 0.4);
      transform: scale(1.06);
    }

    .input-mic-btn.recording {
      background: linear-gradient(135deg, #f43f5e 0%, #ec4899 50%, #8b5cf6 100%);
      border-color: rgba(255, 255, 255, 0.4);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.65);
      animation: micPulse 1.2s ease-in-out infinite;
    }

    @keyframes micPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 16px rgba(244, 63, 94, 0.6); }
      50% { transform: scale(1.1); box-shadow: 0 0 26px rgba(244, 63, 94, 0.9); }
    }

    .input-send-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: linear-gradient(135deg, var(--voice-primary, #6366f1) 0%, var(--voice-secondary, #8b5cf6) 50%, var(--apple-pink) 100%);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      transition: all var(--dur-fast) var(--spring-default), background 0.3s ease;
      box-shadow: 0 2px 12px rgba(var(--voice-primary-rgb), 0.45);
      flex-shrink: 0;
    }

    .input-send-btn:hover {
      transform: scale(1.07);
      box-shadow: 0 4px 24px rgba(var(--voice-primary-rgb), 0.7);
    }

    .input-send-btn:active, .input-mic-btn:active {
      transform: scale(0.90);
      transition: transform var(--dur-instant) ease-out;
    }

    /* ═══════════════════════════════════════════════════════════════
       VOICE PRESETS & SHORTCUT HINTS
       ═══════════════════════════════════════════════════════════════ */

    .voice-presets {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      opacity: 0;
      transform: translateY(8px);
      transition: all var(--dur-slow) var(--spring-default) 0.34s;
    }

    #overlay.visible .voice-presets {
      opacity: 1;
      transform: translateY(0);
    }

    .preset-chip {
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-tertiary);
      font-size: 11px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .preset-chip:hover {
      background: rgba(var(--voice-primary-rgb), 0.2);
      border-color: rgba(var(--voice-primary-rgb), 0.45);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .shortcut-hint {
      margin-top: 10px;
      font-size: 11.5px;
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.28);
      opacity: 0;
      transform: translateY(8px);
      transition: all var(--dur-slow) var(--spring-default) 0.36s;
    }

    #overlay.visible .shortcut-hint {
      opacity: 1;
      transform: translateY(0);
    }

    .shortcut-hint kbd {
      display: inline-block;
      padding: 1px 5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      font-size: 9.5px;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.45);
    }

    @media (max-width: 600px) {
      #aurora-container {
        width: 90vw;
      }

      .input-bar {
        width: 90vw;
      }

      .caption-area {
        max-width: 90vw;
      }

      .chat-history {
        max-width: 90vw;
      }
    }

    /* ═══════════════════════════════════════════════════════════════
       CHAT HISTORY PANEL
       ═══════════════════════════════════════════════════════════════ */

    .history-toggle-btn {
      opacity: 0;
      transform: translateY(-12px);
      transition: all var(--dur-slow) var(--spring-default) 0.12s;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      backdrop-filter: blur(12px);
      margin-right: 8px;
      line-height: 1;
    }

    #overlay.visible .history-toggle-btn {
      opacity: 1;
      transform: translateY(0);
    }

    .history-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: var(--text-primary);
      border-color: var(--glass-border-hover);
    }

    .history-toggle-btn.active {

<body>

          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>

  </div>

  <script>
    /* ═══════════════════════════════════════════════════════════════════════════════
       WOODY OVERLAY — Apple Intelligence Liquid Glass Interface Engine
       ═══════════════════════════════════════════════════════════════════════════════ */

    /* ── Spring Engine ── */
    const SpringEngine = (() => {
      const reducedMotionMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
      function toPhysical(dampingRatio, response, mass) {
        const angularFreq = (2 * Math.PI) / Math.max(response, 0.01);
        return { stiffness: mass * angularFreq * angularFreq, damping: 2 * mass * dampingRatio * angularFreq };
      }
      function animate({ from, to, velocity = 0, dampingRatio = 1, response = 0.35, mass = 1, precision = 0.01, onUpdate, onComplete }) {
        if (reducedMotionMQ.matches) { onUpdate(to, 0); onComplete && onComplete(); return { retarget(t) { onUpdate(t, 0); }, cancel() { } }; }
        const { stiffness, damping } = toPhysical(dampingRatio, response, mass);
        let pos = from, vel = velocity, target = to, raf = null, lastT = null, dead = false;
        function tick(t) {
          if (dead) return;
          if (lastT == null) lastT = t;
          let dt = Math.min((t - lastT) / 1000, 1 / 30);
          lastT = t;
          const subSteps = 2, sdt = dt / subSteps;
          for (let i = 0; i < subSteps; i++) {
            const accel = (-stiffness * (pos - target) - damping * vel) / mass;
            vel += accel * sdt; pos += vel * sdt;
          }
          onUpdate(pos, vel);
          if (Math.abs(pos - target) < precision && Math.abs(vel) < precision) {
            pos = target; vel = 0; onUpdate(pos, vel); dead = true; onComplete && onComplete(); return;
          }
          raf = requestAnimationFrame(tick);
        }
        raf = requestAnimationFrame(tick);
        return {
          retarget(newTarget, addVelocity = 0) { target = newTarget; vel += addVelocity; lastT = null; },
          get position() { return pos; }, get velocity() { return vel; },
          cancel() { dead = true; if (raf) cancelAnimationFrame(raf); },
        };
      }
      function project(velocity, decelerationRate = 0.998) { return (velocity / 1000) * decelerationRate / (1 - decelerationRate); }
      function rubberband(overshoot, dimension, constant = 0.55) { return (overshoot * dimension * constant) / (dimension + constant * Math.abs(overshoot)); }
      return { animate, project, rubberband, get reducedMotion() { return reducedMotionMQ.matches; } };
    })();

    function createVelocityTracker() {
      let hist = [];
      return {
        push(x, y) { hist.push({ x, y, t: performance.now() }); if (hist.length > 5) hist.shift(); },
        velocity() {
          if (hist.length < 2) return { vx: 0, vy: 0 };
          const a = hist[0], b = hist[hist.length - 1], dt = (b.t - a.t) / 1000;
          return dt > 0 ? { vx: (b.x - a.x) / dt, vy: (b.y - a.y) / dt } : { vx: 0, vy: 0 };
        },
        reset() { hist = []; },
      };
    }

    function hapticTick(ms = 8) {
      try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* desktop — vibrate not supported, silent */ }
    }

    const STATES = { IDLE: 'idle', LISTENING: 'listening', THINKING: 'thinking', SPEAKING: 'speaking' };
    let state = STATES.IDLE;
    let isVisible = false;
    let captionText = '';
    let historyOpen = false;
    // Track the current active request ID to prevent two concurrent requests from
    // contaminating each other's caption output.
    let _activeRequestId = null;
    // Debounce flag for submitText — prevents double-sends from rapid Enter/click.
    let _submitting = false;

    // DOM refs
    const overlay = document.getElementById('overlay');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const captionEl = document.getElementById('caption-text');
    const inputEl = document.getElementById('overlay-input');
    const sendBtn = document.getElementById('overlay-send');
    const micBtn = document.getElementById('overlay-mic');
    const closeBtn = document.getElementById('close-btn');
    const historyToggleBtn = document.getElementById('history-toggle-btn');
    const chatHistoryEl = document.getElementById('chat-history');
    const chatHistoryScroll = document.getElementById('chat-history-scroll');
    const presetBtns = document.querySelectorAll('.preset-chip');

    // ── Focus trap helpers ──────────────────────────────────────────────────────
    const FOCUSABLE_SELECTOR = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';

    function getFocusableEls() {
      return Array.from(overlay.querySelectorAll(FOCUSABLE_SELECTOR)).filter(
        el => !el.disabled && el.offsetParent !== null
      );
    }

    function trapFocus(e) {
      if (!isVisible || e.key !== 'Tab') return;
      const els = getFocusableEls();
      if (els.length === 0) return;
      const first = els[0], last = els[els.length - 1];
      if (e.shiftKey) {
        if (document.activeElement === first) { e.preventDefault(); last.focus(); }
      } else {
        if (document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    document.addEventListener('keydown', trapFocus);

    // ── Chat History (localStorage) ─────────────────────────────────────────────
    const HISTORY_KEY = 'WOODY_chat_history';
    const HISTORY_MAX = 50;
    const VALID_ROLES = new Set(['user', 'assistant']);

    function loadHistory() {
      try {
        const raw = localStorage.getItem(HISTORY_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) { return []; }
    }

    function saveHistory(history) {
      try {
        const trimmed = history.slice(-HISTORY_MAX);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(trimmed));
      } catch (e) { /* quota exceeded */ }
    }

    function addToHistory(role, text) {
      if (!VALID_ROLES.has(role)) return;
      const history = loadHistory();
      history.push({
        role,
        text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      });
      saveHistory(history);
      renderHistory();
    }

    function renderHistory() {
      const history = loadHistory();
      chatHistoryScroll.innerHTML = '';
      if (history.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'chat-empty';
        empty.textContent = 'No conversation history yet';
        chatHistoryScroll.appendChild(empty);
        return;
      }
      for (const entry of history) {
        const role = VALID_ROLES.has(entry.role) ? entry.role : 'assistant';
        const bubble = document.createElement('div');
        bubble.className = `chat-bubble ${role}`;
        bubble.textContent = entry.text;
        const timeSpan = document.createElement('span');
        timeSpan.className = 'bubble-time';
        timeSpan.textContent = entry.time || '';
        bubble.appendChild(timeSpan);
        chatHistoryScroll.appendChild(bubble);
      }
      chatHistoryScroll.scrollTop = chatHistoryScroll.scrollHeight;
    }

    function toggleHistory() {
      historyOpen = !historyOpen;
      chatHistoryEl.classList.toggle('open', historyOpen);
      historyToggleBtn.classList.toggle('active', historyOpen);
      historyToggleBtn.setAttribute('aria-expanded', String(historyOpen));
      if (historyOpen) renderHistory();
    }

    historyToggleBtn.setAttribute('aria-expanded', 'false');
    historyToggleBtn.addEventListener('click', toggleHistory);
    renderHistory();

    // ── Color Utilities & Dynamic Voice Harmonics ───────────────────────────────
    let speakingColorProgress = 0;

    function hslToRgb(h, s, l) {
      h = ((h % 360) + 360) % 360;
      s = Math.max(0, Math.min(100, s)) / 100;
      l = Math.max(0, Math.min(100, l)) / 100;
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = l - c / 2;
      let r = 0, g = 0, b = 0;
      if (0 <= h && h < 60) { r = c; g = x; b = 0; }
      else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
      else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
      else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
      else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
      else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
      return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
    }

    function getVoiceColorHarmonics(st, currentRms, t) {
      const energy = Math.min(1.0, currentRms * 1.5);
      let h1, h2, h3;

      if (st === 'idle') {
        const shift = Math.sin(t * 0.5) * 16;
        h1 = (240 + shift) % 360;       // Indigo
        h2 = (275 + shift * 1.2) % 360; // Violet
        h3 = (195 + shift * 0.8) % 360; // Soft cyan
      } else if (st === 'listening') {
        // Dynamic Siri / Apple spectrum: cyan (195) -> purple (275) -> neon fuchsia (335)
        h1 = (195 + energy * 75 + Math.sin(t * 1.2) * 18) % 360;
        h2 = (280 + energy * 50 + Math.cos(t * 1.5) * 22) % 360;
        h3 = (335 + energy * 40) % 360;
      } else if (st === 'thinking') {
        // Golden Amber & Solar Glow
        h1 = (44 + Math.sin(t * 2.0) * 16) % 360;
        h2 = (26 + Math.cos(t * 1.8) * 16) % 360;
        h3 = (280 + Math.sin(t * 1.2) * 20) % 360;
      } else if (st === 'speaking') {
        // Dynamic AI Voice Response: Gradient colors morph continuously as the AI responds in voice!
        // Swirls through Luminous Violet (265°) -> Neon Magenta (325°) -> Solar Gold (48°) -> Electric Cyan (185°) -> Azure (215°)
        const speechShift = (speakingColorProgress * 32 + t * 24) % 360;
        h1 = (265 + speechShift + energy * 68 + Math.sin(t * 2.2) * 26) % 360;
        h2 = (325 + speechShift * 1.15 + energy * 52 + Math.cos(t * 1.7) * 28) % 360;
        h3 = (185 + speechShift * 0.88 + energy * 60 + Math.sin(t * 1.3) * 24) % 360;
      } else {
        h1 = 240; h2 = 275; h3 = 195;
      }

      const c1 = hslToRgb(h1, 88 + energy * 12, 60 + energy * 18);
      const c2 = hslToRgb(h2, 92 + energy * 8, 62 + energy * 20);
      const c3 = hslToRgb(h3, 85 + energy * 15, 65 + energy * 15);
      const peak = hslToRgb((h1 + 60 + Math.sin(t * 2.0) * 20) % 360, 100, 80 + energy * 18);

      return { primary: c1, secondary: c2, tertiary: c3, peak, energy, h1, h2, h3 };
    }

    function syncVoiceThemeVariables(colors, energy) {
      const [pr, pg, pb] = colors.primary;
      const [sr, sg, sb] = colors.secondary;
      const [tr, tg, tb] = colors.tertiary;
      overlay.style.setProperty('--voice-primary-rgb', `${pr}, ${pg}, ${pb}`);
      overlay.style.setProperty('--voice-secondary-rgb', `${sr}, ${sg}, ${sb}`);
      overlay.style.setProperty('--voice-tertiary-rgb', `${tr}, ${tg}, ${tb}`);
      overlay.style.setProperty('--voice-primary', `rgb(${pr}, ${pg}, ${pb})`);
      overlay.style.setProperty('--voice-secondary', `rgb(${sr}, ${sg}, ${sb})`);
      overlay.style.setProperty('--voice-tertiary', `rgb(${tr}, ${tg}, ${tb})`);
      overlay.style.setProperty('--voice-energy', String(energy.toFixed(3)));
    }

    const STATE_LABELS = {
      idle: 'Ready', listening: 'Listening', thinking: 'Processing', speaking: 'Speaking',
    };

    // ── Audio Feedback ──────────────────────────────────────────────────────────
    let audioCtx = null;
    function playTick(freq = 880, dur = 0.05) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value = freq; o.type = 'sine';
        g.gain.setValueAtTime(0.03, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.start(audioCtx.currentTime); o.stop(audioCtx.currentTime + dur);
      } catch (e) { /* silent */ }
    }

    // ── Live Microphone (Web Audio API) ──────────────────────────────────────────
    let micStream = null;
    let micAudioCtx = null;
    let micAnalyser = null;
    let micDataArray = null;
    let isMicActive = false;

    async function toggleMicrophone() {
      if (isMicActive) {
        stopMicrophone();
      } else {
        await startMicrophone();
      }
    }

    async function startMicrophone() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        micAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (micAudioCtx.state === 'suspended') { await micAudioCtx.resume(); }
        const source = micAudioCtx.createMediaStreamSource(micStream);
        micAnalyser = micAudioCtx.createAnalyser();
        micAnalyser.fftSize = 256;
        micAnalyser.smoothingTimeConstant = 0.7;
        source.connect(micAnalyser);
        micDataArray = new Uint8Array(micAnalyser.frequencyBinCount);
        isMicActive = true;
        setState(STATES.LISTENING);
        micBtn.classList.add('recording');
        micBtn.setAttribute('title', 'Mute Microphone (M)');
        playTick(660, 0.06);
        if (!isVisible) showOverlay();
      } catch (err) {
        console.warn('Microphone access unavailable or denied:', err);
        isMicActive = true;
        setState(STATES.LISTENING);
        micBtn.classList.add('recording');
        targetRms = 0.68;
      }
    }

    function stopMicrophone() {
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (micAudioCtx && micAudioCtx.state !== 'closed') {
        micAudioCtx.close().catch(() => {});
        micAudioCtx = null;
      }
      micAnalyser = null;
      isMicActive = false;
      micBtn.classList.remove('recording');
      micBtn.setAttribute('title', 'Toggle Live Voice / Mic (M)');
      setState(STATES.IDLE);
    }

    if (micBtn) {
      micBtn.addEventListener('click', toggleMicrophone);
    }

    // ── Simulated AI Voice Response Streamer (Interactive Demo) ────────────────
    let _activeSpeechTimer = null;
    function simulateVoiceResponse(fullText, speed = 80) {
      if (_activeSpeechTimer) { clearInterval(_activeSpeechTimer); _activeSpeechTimer = null; }
      setState(STATES.SPEAKING);
      captionText = '';
      captionEl.textContent = '';
      const words = fullText.split(' ');
      let idx = 0;

      _activeSpeechTimer = setInterval(() => {
        if (idx >= words.length) {
          clearInterval(_activeSpeechTimer);
          _activeSpeechTimer = null;
          addToHistory('assistant', fullText);
          setTimeout(() => {
            if (state === STATES.SPEAKING) setState(STATES.IDLE);
          }, 1800);
          return;
        }

        const word = words[idx++];
        captionText += (captionText ? ' ' : '') + word;
        captionEl.textContent = captionText.length > 250 ? '…' + captionText.slice(-250) : captionText;

        // Advance dynamic speech gradient color progress & voice pulse
        speakingColorProgress += 0.32;
        targetRms = 0.50 + Math.random() * 0.45;
        playTick(440 + (idx % 8) * 60, 0.03);
      }, speed);
    }

    // Voice Preset Chips
    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.mode;
        if (mode === 'mic') {
          toggleMicrophone();
        } else if (mode === 'whisper') {
          simulateVoiceResponse("I am speaking in a soft whisper. Notice how the aurora gradient gently shifts through soothing indigo, deep violet, and tranquil cyan hues as I speak.", 95);
        } else if (mode === 'talking') {
          simulateVoiceResponse("When I respond in voice, my neural acoustic visualizer dynamically shifts gradient colors across vibrant amethyst, electric sky blue, and hot fuchsia to match the cadence of my speech!", 80);
        } else if (mode === 'loud') {
          simulateVoiceResponse("Peak energy voice output! Watch the brilliant solar gold, plasma fire coral, and radiant white core highlights surge dynamically with every syllable and inflection!", 70);
        }
      });
    });

    // ── Show / Hide Springs ─────────────────────────────────────────────────────
    const supportsGlassLens = (window.CSS && CSS.supports &&
      (CSS.supports('backdrop-filter', 'url(#glass-lens)') || CSS.supports('-webkit-backdrop-filter', 'url(#glass-lens)')));
    let overlayOpacitySpring = null, overlayYSpring = null, overlayBlurSpring = null;
    let overlayOpacity = 0, overlayY = 24, overlayBlur = 12;
    let _prevFocusEl = null;

    function paintOverlay() {
      overlay.style.opacity = String(overlayOpacity);
      overlay.style.transform = overlayY ? `translateY(${overlayY}px)` : '';
      const filterStr = `${supportsGlassLens ? 'url(#glass-lens) ' : ''}blur(${overlayBlur}px) saturate(200%)`;
      overlay.style.backdropFilter = filterStr;
      overlay.style.webkitBackdropFilter = filterStr;
    }

    function showOverlay() {
      isVisible = true;
      _prevFocusEl = document.activeElement;
      overlay.classList.remove('hidden');
      [overlayOpacitySpring, overlayYSpring, overlayBlurSpring].forEach(s => s && s.cancel());
      requestAnimationFrame(() => {
        overlay.classList.add('visible');
        overlayOpacitySpring = SpringEngine.animate({
          from: overlayOpacity, to: 1, dampingRatio: 1, response: 0.4,
          onUpdate: (v) => { overlayOpacity = v; paintOverlay(); }
        });
        overlayYSpring = SpringEngine.animate({
          from: overlayY, to: 0, dampingRatio: 0.86, response: 0.36,
          onUpdate: (v) => { overlayY = v; paintOverlay(); }
        });
        overlayBlurSpring = SpringEngine.animate({
          from: overlayBlur, to: 70, dampingRatio: 1, response: 0.4,
          onUpdate: (v) => { overlayBlur = v; paintOverlay(); }
        });
        inputEl.focus();
        if (!_auroraRunning) startAurora();
      });
    }

    function hideOverlay(velocity = 0) {
      isVisible = false;
      if (isMicActive) stopMicrophone();
      overlay.classList.remove('visible');
      [overlayOpacitySpring, overlayYSpring, overlayBlurSpring].forEach(s => s && s.cancel());
      overlayOpacitySpring = SpringEngine.animate({
        from: overlayOpacity, to: 0, dampingRatio: 1, response: 0.32,
        onUpdate: (v) => { overlayOpacity = v; paintOverlay(); },
        onComplete: () => {
          overlay.classList.add('hidden');
          overlayY = 24; overlayBlur = 12;
          if (_prevFocusEl && typeof _prevFocusEl.focus === 'function') {
            _prevFocusEl.focus();
          }
        }
      });
      overlayYSpring = SpringEngine.animate({
        from: overlayY, to: 40, velocity, dampingRatio: 1, response: 0.32,
        onUpdate: (v) => { overlayY = v; paintOverlay(); }
      });
      overlayBlurSpring = SpringEngine.animate({
        from: overlayBlur, to: 16, dampingRatio: 1, response: 0.3,
        onUpdate: (v) => { overlayBlur = v; paintOverlay(); }
      });
    }

    function toggleOverlay() {
      if (isVisible) hideOverlay();
      else showOverlay();
    }

    // ── Liquid Glass Specular highlight ─────────────────────────────────────────
    const LIQUID_GLASS_SELECTOR = '#overlay, .input-bar, .status-pill, .close-btn, .input-mic-btn, .input-send-btn';
    function ensureSpecularLayer(el) {
      let span = el.querySelector(':scope > .specular-layer');
      if (!span) {
        span = document.createElement('span');
        span.className = 'specular-layer';
        span.setAttribute('aria-hidden', 'true');
        el.appendChild(span);
      }
      return span;
    }
    function positionSpecular(span, el, clientX, clientY) {
      const r = el.getBoundingClientRect();
      span.style.setProperty('--sx', `${((clientX - r.left) / r.width) * 100}%`);
      span.style.setProperty('--sy', `${((clientY - r.top) / r.height) * 100}%`);
    }
    let liquidHoverEl = null;
    document.addEventListener('pointermove', (e) => {
      const el = e.target.closest(LIQUID_GLASS_SELECTOR);
      if (el !== liquidHoverEl) {
        if (liquidHoverEl) { const prev = liquidHoverEl.querySelector(':scope > .specular-layer'); if (prev) prev.classList.remove('specular-hover'); }
        liquidHoverEl = el;
      }
      if (!el) return;
      const span = ensureSpecularLayer(el);
      positionSpecular(span, el, e.clientX, e.clientY);
      span.classList.add('specular-hover');
    });
    document.addEventListener('pointerdown', (e) => {
      const el = e.target.closest(LIQUID_GLASS_SELECTOR);
      if (!el) return;
      const span = ensureSpecularLayer(el);
      positionSpecular(span, el, e.clientX, e.clientY);
      span.classList.add('specular-press');
    });
    document.addEventListener('pointerup', () => {
      document.querySelectorAll('.specular-layer.specular-press').forEach(s => s.classList.remove('specular-press'));
    });

    closeBtn.addEventListener('click', () => hideOverlay());

    // ── Pull-down-to-dismiss ─────────────────────────────────────────────────────
    const overlayVTracker = createVelocityTracker();
    let ovDragging = false, ovPointerId = null, ovStartY = 0, ovStartTY = 0;

    function ovPointerDown(e) {
      if (e.target.closest('.input-bar, .close-btn, .voice-presets')) return;
      ovDragging = true; ovPointerId = e.pointerId;
      ovStartY = e.clientY; ovStartTY = overlayY;
      overlayVTracker.reset(); overlayVTracker.push(e.clientX, e.clientY);
      [overlayOpacitySpring, overlayYSpring].forEach(s => s && s.cancel());
    }
    function ovPointerMove(e) {
      if (!ovDragging || e.pointerId !== ovPointerId) return;
      overlayVTracker.push(e.clientX, e.clientY);
      let dy = ovStartTY + (e.clientY - ovStartY);
      if (dy < 0) dy = SpringEngine.rubberband(dy, window.innerHeight * 0.6);
      overlayY = dy;
      overlayOpacity = Math.max(0.25, 1 - Math.abs(dy) / (window.innerHeight * 0.5));
      paintOverlay();
    }
    function ovPointerUp(e) {
      if (!ovDragging || e.pointerId !== ovPointerId) return;
      ovDragging = false;
      const { vy } = overlayVTracker.velocity();
      const projected = overlayY + SpringEngine.project(vy);
      if (projected > 120 || vy > 700) {
        hideOverlay(vy);
      } else {
        overlayYSpring = SpringEngine.animate({
          from: overlayY, to: 0, velocity: vy, dampingRatio: 0.82, response: 0.34,
          onUpdate: (v) => { overlayY = v; paintOverlay(); }
        });
        overlayOpacitySpring = SpringEngine.animate({
          from: overlayOpacity, to: 1, dampingRatio: 1, response: 0.3,
          onUpdate: (v) => { overlayOpacity = v; paintOverlay(); }
        });
      }
    }
    overlay.addEventListener('pointerdown', ovPointerDown);
    document.addEventListener('pointermove', ovPointerMove);
    document.addEventListener('pointerup', ovPointerUp);
    document.addEventListener('pointercancel', ovPointerUp);

    // ── State management ─────────────────────────────────────────────────────────
    function setState(newState) {
      state = newState;
      const label = STATE_LABELS[state] || 'Ready';
      statusText.textContent = label;

      overlay.classList.remove('state-idle', 'state-listening', 'state-thinking', 'state-speaking');
      statusDot.classList.remove('listening', 'thinking', 'speaking');

      if (state !== 'idle') {
        overlay.classList.add(`state-${state}`);
        statusDot.classList.add(state);
      }
    }

    // ── Input handling ───────────────────────────────────────────────────────────
    function submitText() {
      const text = inputEl.value.trim();
      if (!text || _submitting) return;
      _submitting = true;
      setTimeout(() => { _submitting = false; }, 800);

      inputEl.value = '';
      captionText = '';
      _activeRequestId = null;
      captionEl.textContent = `You: ${text}`;
      setState(STATES.THINKING);
      playTick(960, 0.06);
      hapticTick(10);

      addToHistory('user', text);

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'text_command', text }));
      } else {
        setTimeout(() => {
          simulateVoiceResponse(`I have processed your request: "${text}". Notice how my voice gradient dynamically shifts colors across vibrant purple, cyan, magenta, and solar gold as I speak!`, 75);
        }, 650);
      }
    }

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submitText(); }
    });
    sendBtn.addEventListener('click', submitText);

    // Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.code === 'Space') { e.preventDefault(); toggleOverlay(); }
      if (e.key === 'Escape' && isVisible) { hideOverlay(); }
      if ((e.key === 'm' || e.key === 'M') && !e.ctrlKey && !e.altKey && document.activeElement !== inputEl) {
        e.preventDefault();
        toggleMicrophone();
      }
      if (e.key === '1' && document.activeElement !== inputEl) { targetRms = 0.25; setState(STATES.SPEAKING); }
      if (e.key === '2' && document.activeElement !== inputEl) { targetRms = 0.65; setState(STATES.SPEAKING); }
      if (e.key === '3' && document.activeElement !== inputEl) { targetRms = 0.95; setState(STATES.SPEAKING); }
    });

    // ── Floating Audio Stardust Particles Engine ────────────────────────────────
    const particles = [];
    const MAX_PARTICLES = 65;

    function spawnAudioParticle(x, y, color, size, vx, vy, life) {
      if (particles.length < MAX_PARTICLES) {
        particles.push({ x, y, color, size, vx, vy, life, maxLife: life });
      }
    }

    function updateAndDrawParticles(ctx, dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        p.x += p.vx;
        p.y += p.vy;
        p.vy -= 0.015; // float gently upward
        const norm = p.life / p.maxLife;
        const alpha = norm * 0.85;
        const [r, g, b] = p.color;

        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.5, p.size * norm), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
        ctx.shadowColor = `rgba(${r}, ${g}, ${b}, ${alpha})`;
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.restore();
      }
    }

    // ── Aurora Canvas Visualizer (Multi-Harmonic Liquid Wave Engine) ────────────
    const auroraCanvas = document.getElementById('aurora-canvas');
    const auroraCtx = auroraCanvas.getContext('2d');
    let phase = 0;
    let rms = 0;
    let targetRms = 0;
    let _auroraRunning = false;
    let _auroraRaf = null;

    function resizeAurora() {
      const container = document.getElementById('aurora-container');
      const dpr = window.devicePixelRatio || 1;
      const w = container.clientWidth;
      const h = container.clientHeight;
      auroraCanvas.width = Math.round(w * dpr);
      auroraCanvas.height = Math.round(h * dpr);
      auroraCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeAurora();
    window.addEventListener('resize', resizeAurora);

    function drawAurora() {
      if (!isVisible) {
        _auroraRunning = false;
        _auroraRaf = null;
        return;
      }

      // Live Microphone audio data poll
      if (isMicActive && micAnalyser && micDataArray) {
        micAnalyser.getByteFrequencyData(micDataArray);
        let sum = 0;
        for (let i = 0; i < micDataArray.length; i++) {
          sum += micDataArray[i];
        }
        const avg = sum / micDataArray.length;
        const liveRms = Math.min(1.0, (avg / 128) * 1.5);
        targetRms = Math.max(targetRms * 0.85, liveRms);
      }

      phase += 0.034;
      if (state === STATES.SPEAKING) {
        speakingColorProgress += 0.036;
      }
      rms += (targetRms - rms) * 0.14;
      targetRms *= 0.93;

      const container = document.getElementById('aurora-container');
      const w = container.clientWidth;
      const h = container.clientHeight;
      const cx = w / 2;
      const cy = h / 2;

      auroraCtx.clearRect(0, 0, w, h);

      // Compute dynamic voice color spectrum & harmonics
      const colors = getVoiceColorHarmonics(state, rms, phase);
      syncVoiceThemeVariables(colors, colors.energy);

      const [pr, pg, pb] = colors.primary;
      const [sr, sg, sb] = colors.secondary;
      const [tr, tg, tb] = colors.tertiary;
      const [pkr, pkg, pkb] = colors.peak;

      // 5-Layer Fluid Sinusoidal Wave Ribbons
      const layers = [
        { alpha: 0.12, freqMult: 0.75, ampMult: 0.45, timeOff: 1.2, width: 22, rgb: colors.tertiary },
        { alpha: 0.24, freqMult: 1.15, ampMult: 0.65, timeOff: 0.7, width: 12, rgb: colors.secondary },
        { alpha: 0.46, freqMult: 1.55, ampMult: 0.85, timeOff: 0.3, width: 6,  rgb: colors.primary },
        { alpha: 0.82, freqMult: 1.95, ampMult: 1.00, timeOff: 0.0, width: 2.8, rgb: colors.peak },
        { alpha: 0.92, freqMult: 2.50, ampMult: 0.92, timeOff: -0.2, width: 1.4, rgb: colors.primary },
      ];

      // Spawn Audio Stardust Particles on voice activity peaks
      if (rms > 0.12 && Math.random() < rms * 0.75) {
        const px = cx + (Math.random() - 0.5) * w * 0.75;
        const py = cy + (Math.random() - 0.5) * 24;
        const pColor = Math.random() > 0.5 ? colors.primary : colors.secondary;
        spawnAudioParticle(
          px, py, pColor,
          1.5 + Math.random() * 2.5,
          (Math.random() - 0.5) * 1.2,
          -0.5 - Math.random() * 1.5,
          1.2 + Math.random() * 0.8
        );
      }

      // Draw Wave Ribbons
      for (const layer of layers) {
        const t = phase + layer.timeOff;
        const [r, g, b] = layer.rgb;
        const points = [];
        const numPoints = 96;

        for (let i = 0; i <= numPoints; i++) {
          const nx = i / numPoints;
          const x = nx * w;

          let amp;
          if (state === 'idle')          amp = 6 + rms * 8;
          else if (state === 'listening') amp = 16 + rms * 48;
          else if (state === 'thinking')  amp = 12 + 8 * Math.sin(t * 2.5);
          else if (state === 'speaking')  amp = 18 + rms * 52;
          else                            amp = 6;

          amp *= layer.ampMult;

          const freq = layer.freqMult;
          const wave =
            Math.sin(nx * Math.PI * 2.8 * freq + t * 2.0) * amp +
            Math.sin(nx * Math.PI * 4.4 * freq - t * 1.6) * amp * 0.5 +
            Math.sin(nx * Math.PI * 6.8 * freq + t * 2.8) * amp * 0.25 +
            Math.sin(nx * Math.PI * 1.2 * freq + t * 0.8) * amp * 0.4;

          const envelope = Math.pow(Math.sin(nx * Math.PI), 1.4);
          const y = cy + wave * envelope;
          points.push({ x, y });
        }

        // Fill band with dynamic multi-stop linear gradient
        auroraCtx.beginPath();
        auroraCtx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length - 1; i++) {
          const mx = (points[i].x + points[i + 1].x) / 2;
          const my = (points[i].y + points[i + 1].y) / 2;
          auroraCtx.quadraticCurveTo(points[i].x, points[i].y, mx, my);
        }
        auroraCtx.lineTo(points[points.length - 1].x, points[points.length - 1].y);

        for (let i = points.length - 1; i >= 0; i--) {
          const mirrorY = cy - (points[i].y - cy);
          auroraCtx.lineTo(points[i].x, mirrorY);
        }
        auroraCtx.closePath();

        const grad = auroraCtx.createLinearGradient(0, cy, w, cy);
        grad.addColorStop(0, `rgba(${tr}, ${tg}, ${tb}, ${layer.alpha * 0.25})`);
        grad.addColorStop(0.25, `rgba(${pr}, ${pg}, ${pb}, ${layer.alpha * 0.7})`);
        grad.addColorStop(0.5, `rgba(${sr}, ${sg}, ${sb}, ${layer.alpha})`);
        grad.addColorStop(0.75, `rgba(${pkr}, ${pkg}, ${pkb}, ${layer.alpha * 0.7})`);
        grad.addColorStop(1, `rgba(${tr}, ${tg}, ${tb}, ${layer.alpha * 0.25})`);
        auroraCtx.fillStyle = grad;
        auroraCtx.fill();

        // Top wave stroke with specular brilliance
        auroraCtx.beginPath();
        auroraCtx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length - 1; i++) {
          const mx = (points[i].x + points[i + 1].x) / 2;
          const my = (points[i].y + points[i + 1].y) / 2;
          auroraCtx.quadraticCurveTo(points[i].x, points[i].y, mx, my);
        }
        auroraCtx.lineTo(points[points.length - 1].x, points[points.length - 1].y);

        const strokeGrad = auroraCtx.createLinearGradient(0, cy, w, cy);
        strokeGrad.addColorStop(0, `rgba(${tr}, ${tg}, ${tb}, ${layer.alpha * 0.4})`);
        strokeGrad.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${Math.min(1, layer.alpha * 1.5)})`);
        strokeGrad.addColorStop(1, `rgba(${sr}, ${sg}, ${sb}, ${layer.alpha * 0.4})`);

        auroraCtx.strokeStyle = strokeGrad;
        auroraCtx.lineWidth = layer.width;
        auroraCtx.lineCap = 'round';
        auroraCtx.stroke();
      }

      // Center Multi-Stop Radial Core Bloom
      const glowR = 28 + rms * 38;
      const glow = auroraCtx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
      glow.addColorStop(0, `rgba(255, 255, 255, ${0.45 + rms * 0.4})`);
      glow.addColorStop(0.25, `rgba(${pr}, ${pg}, ${pb}, ${0.35 + rms * 0.3})`);
      glow.addColorStop(0.65, `rgba(${sr}, ${sg}, ${sb}, ${0.15 + rms * 0.2})`);
      glow.addColorStop(1, `rgba(${tr}, ${tg}, ${tb}, 0)`);
      auroraCtx.fillStyle = glow;
      auroraCtx.fillRect(cx - glowR, cy - glowR, glowR * 2, glowR * 2);

      // Render floating audio particles
      updateAndDrawParticles(auroraCtx, 0.016);

      _auroraRaf = requestAnimationFrame(drawAurora);
    }

    function startAurora() {
      if (_auroraRunning) return;
      _auroraRunning = true;
      _auroraRaf = requestAnimationFrame(drawAurora);
    }

    // ── WebSocket Connection ─────────────────────────────────────────────────────
    let ws = null;
    let _wsReconnectDelay = 1000;
    let _wsReconnectTimer = null;
    let _wsIntentionalClose = false;

    function connectWs() {
      if (_wsIntentionalClose) return;
      if (_wsReconnectTimer) { clearTimeout(_wsReconnectTimer); _wsReconnectTimer = null; }

      try {
        ws = new WebSocket('ws://localhost:8765');

        ws.onopen = () => {
          _wsReconnectDelay = 1000;
          setState(STATES.IDLE);
        };

        ws.onmessage = (e) => {
          let msg;
          try { msg = JSON.parse(e.data); } catch { return; }

          if (msg.type === 'wake') {
            showOverlay();
            setState(STATES.LISTENING);
          } else if (msg.type === 'thinking') {
            _activeRequestId = msg.request_id || null;
            captionText = '';
            captionEl.textContent = '';
            setState(STATES.THINKING);
          } else if (msg.type === 'response_chunk') {
            if (msg.request_id && _activeRequestId && msg.request_id !== _activeRequestId) return;
            setState(STATES.SPEAKING);
            captionText += msg.chunk;
            captionEl.textContent = captionText.length > 300
              ? '…' + captionText.slice(-300)
              : captionText;
            speakingColorProgress += 0.28;
            targetRms = 0.55 + Math.random() * 0.40;
            playTick(480 + Math.random() * 220, 0.025);
          } else if (msg.type === 'response_complete') {
            if (msg.request_id && _activeRequestId && msg.request_id !== _activeRequestId) return;
            if (captionText.trim()) {
              addToHistory('assistant', captionText.trim());
              if (!historyOpen) toggleHistory();
            }
            _activeRequestId = null;
            setState(STATES.IDLE);
            setTimeout(() => { captionText = ''; captionEl.textContent = ''; }, 5000);
          }
        };

        ws.onerror = () => {};

        ws.onclose = () => {
          ws = null;
          if (_wsIntentionalClose) return;
          _wsReconnectTimer = setTimeout(() => {
            _wsReconnectDelay = Math.min(_wsReconnectDelay * 2, 30_000);
            connectWs();
          }, _wsReconnectDelay);
        };

      } catch (e) {
        _wsReconnectTimer = setTimeout(() => {
          _wsReconnectDelay = Math.min(_wsReconnectDelay * 2, 30_000);
          connectWs();
        }, _wsReconnectDelay);
      }
    }

    // ── Pet Mode Handler ────────────────────────────────────────────────────────
    const petBtn = document.getElementById('pet-toggle-btn');
    if (petBtn) {
      petBtn.addEventListener('click', async () => {
        playTick(1100, 0.08);
        hapticTick(15);
        petBtn.style.transform = 'scale(0.92)';
        setTimeout(() => { petBtn.style.transform = ''; }, 150);

        try {
          const res = await fetch('http://127.0.0.1:8765/api/launch_pet');
          const data = await res.json();
          if (data.status === 'ok') {
            captionEl.textContent = '🐾 Desktop AI Pet Companion activated!';
          }
        } catch (e) {
          console.log('Pet launch error:', e);
          captionEl.textContent = '🐾 Launching Desktop Pet…';
        }
      });
    }

    // ── Boot ─────────────────────────────────────────────────────────────────────
    connectWs();
    setTimeout(() => showOverlay(), 300);
  </script>
</body>
