[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wodi"
version = "3.0.0"
description = "Wodi — Local-First Windows AI Operating System Layer"
authors = [{ name = "Wodi Team" }]
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
keywords = ["ai", "assistant", "windows", "local", "llm", "agent"]

dependencies = [
    # ── Core (always installed, lightweight) ───────────────────────────────
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "tenacity>=9.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "rich>=13.7.0",
    "click>=8.1.7",
    "psutil>=6.0.0",
    "numpy>=1.26.0",
    "Pillow>=10.4.0",
    "mss>=9.0.2",
]

[project.optional-dependencies]
# pip install -e ".[audio]"
audio = [
    "pyaudio>=0.2.14",
    "sounddevice>=0.4.7",
    "openwakeword>=0.6.0",
    "faster-whisper>=1.0.3",
    "silero-vad>=5.1",
]
# pip install -e ".[desktop]"
desktop = [
    "pywin32>=308",
    "comtypes>=1.4.4",
    "pywinauto>=0.6.8",
    "pyautogui>=0.9.54",
    "pynput>=1.7.7",
]
# pip install -e ".[vision]"
vision = [
    "easyocr>=1.7.2",
    "pytesseract>=0.3.13",
]
# pip install -e ".[ui]"
ui = [
    "PySide6>=6.7.2",
]
# pip install -e ".[llm]"
llm = [
    "openai>=1.40.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
]
# pip install -e ".[browser]"
browser = [
    "playwright>=1.45.0",
]
# pip install -e ".[memory]"
memory = [
    "sqlite-vec>=0.1.6",
    "llama-index-core>=0.10.60",
]
# pip install -e ".[ipc]"
ipc = [
    "grpcio>=1.65.0",
    "grpcio-tools>=1.65.0",
]
# pip install -e ".[tts]"
tts = [
    "piper-tts",
]
# pip install -e ".[all]"  — everything
all = [
    "wodi[audio,desktop,vision,ui,llm,browser,memory,ipc,tts]",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "black>=24.8.0",
]


[project.scripts]
wodi = "wodi.__main__:main"
wodi-kernel = "wodi.kernel.kernel:cli_start"
wodi-eval = "wodi.observability.eval.harness:cli_run"

[tool.setuptools.packages.find]
where = ["."]
include = ["wodi*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
