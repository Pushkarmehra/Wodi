<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wodi — AI Assistant Overlay (Apple Intelligence Liquid Glass)</title>
  <meta name="description" content="Wodi AI Assistant — Apple Intelligence inspired liquid glass interface." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════════════════════════════════════════
       WODI OVERLAY — Apple Intelligence Liquid Glass Edition
       Springs · Materials · Iridescent Glow · Depth · Apple UI Refraction
       ═══════════════════════════════════════════════════════════════════════════ */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* ── Springs ── */
      --spring-default: cubic-bezier(0.22, 1, 0.36, 1);
      --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --spring-snappy: cubic-bezier(0.16, 1, 0.3, 1);
      --spring-gentle: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --dur-instant: 60ms;
      --dur-fast: 120ms;
      --dur-normal: 280ms;
      --dur-slow: 420ms;

      /* ── Apple Glass Palette ── */
      --glass-dark: rgba(14, 14, 24, 0.45);
      --glass-card: rgba(30, 30, 46, 0.35);
      --glass-pill: rgba(40, 40, 60, 0.30);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-border-hover: rgba(255, 255, 255, 0.35);
      --glass-shine: rgba(255, 255, 255, 0.20);

      /* ── Spectrum Accent Tokens ── */
      --apple-cyan: #38bdf8;
      --apple-indigo: #6366f1;
      --apple-violet: #a855f7;
      --apple-pink: #ec4899;
      --apple-amber: #fbbf24;
      --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.15), 0 0 80px rgba(168, 85, 247, 0.10);

      /* ── Text ── */
      --text-primary: rgba(255, 255, 255, 0.96);
      --text-secondary: rgba(255, 255, 255, 0.65);
      --text-tertiary: rgba(255, 255, 255, 0.35);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      font-optical-sizing: auto;
    }

    /* ═══════════════════════════════════════════════════════════════
       LIQUID GLASS — real-time lensing + pointer-reactive specular
       highlights (Apple Intelligence Edition)
       ═══════════════════════════════════════════════════════════════ */
    @supports ((backdrop-filter: url(#glass-lens)) or (-webkit-backdrop-filter: url(#glass-lens))) {
      #overlay {
        backdrop-filter: url(#glass-lens) blur(70px) saturate(200%);
        -webkit-backdrop-filter: url(#glass-lens) blur(70px) saturate(200%);
      }

      .input-bar {
        backdrop-filter: url(#glass-lens) blur(40px) saturate(180%);
        -webkit-backdrop-filter: url(#glass-lens) blur(40px) saturate(180%);
      }
    }

    #overlay,
    .input-bar,
    .status-pill,
    .close-btn {
      position: relative;
    }

    .specular-layer {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle 240px at var(--sx, 50%) var(--sy, 0%),
          rgba(255, 255, 255, 0.35), rgba(168, 85, 247, 0.15) 35%,
          rgba(56, 189, 248, 0.08) 60%, transparent 80%);
      opacity: 0;
      transition: opacity var(--dur-normal) ease;
      pointer-events: none;
      mix-blend-mode: overlay;
      z-index: 3;
    }

    .specular-layer.specular-hover {
      opacity: 1;
    }

    .specular-layer.specular-press {
      opacity: 1;
      transition: opacity var(--dur-instant) ease-out;
      background: radial-gradient(circle 180px at var(--sx, 50%) var(--sy, 50%),
          rgba(255, 255, 255, 0.50), rgba(236, 72, 153, 0.20) 40%,
          rgba(99, 102, 241, 0.10) 65%, transparent 80%);
    }

    @media (prefers-reduced-motion: reduce) {
      .specular-layer {
        transition: none;
      }
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       REDUCED MOTION / TRANSPARENCY
       ═══════════════════════════════════════════════════════════════════════════ */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 180ms !important;
        transition-timing-function: ease !important;
      }

      #aurora-canvas {
        display: none !important;
      }
    }

    @media (prefers-reduced-transparency: reduce) {
      #overlay {
        background: rgba(14, 14, 22, 0.98) !important;
        backdrop-filter: none !important;
      }

      .input-bar {
        background: rgba(30, 30, 44, 0.98) !important;
        backdrop-filter: none !important;
      }
    }

    /* ═══════════════════════════════════════════════════════════════
       OVERLAY BACKDROP — Fullscreen frosted dark glass with light rim
       ═══════════════════════════════════════════════════════════════ */

    #overlay {
      position: fixed;
      inset: 0;
      background: var(--glass-dark);
      backdrop-filter: blur(70px) saturate(200%);
      -webkit-backdrop-filter: blur(70px) saturate(200%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      opacity: 0;
      cursor: default;
      touch-action: none;
    }

    #overlay.hidden {
      pointer-events: none;
    }

    /* Ambient reactive spectrum aura */
    #overlay::before {
      content: '';
      position: absolute;
      width: 660px;
      height: 660px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -58%);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(99, 102, 241, 0.14) 0%, rgba(168, 85, 247, 0.05) 40%, transparent 70%);
      pointer-events: none;
      transition: all 0.8s var(--spring-default);
    }

    /* State-reactive ambient spectrum transitions */
    #overlay.state-listening::before {
      background: radial-gradient(ellipse, rgba(56, 189, 248, 0.22) 0%, rgba(236, 72, 153, 0.14) 35%, rgba(139, 92, 246, 0.06) 60%, transparent 75%);
    }

    #overlay.state-thinking::before {
      background: radial-gradient(ellipse, rgba(251, 191, 36, 0.20) 0%, rgba(245, 158, 11, 0.08) 45%, transparent 70%);
    }

    #overlay.state-speaking::before {
      background: radial-gradient(ellipse, rgba(168, 85, 247, 0.24) 0%, rgba(99, 102, 241, 0.12) 45%, transparent 70%);
    }

    /* ═══════════════════════════════════════════════════════════════
       TOP BAR
       ═══════════════════════════════════════════════════════════════ */

    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      z-index: 2;
    }

    .top-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(-12px);
      transition: all var(--dur-slow) var(--spring-default) 0.12s;
    }

    #overlay.visible .top-brand {
      opacity: 1;
      transform: translateY(0);
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.6);
    }

    .brand-name {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.92);
      letter-spacing: -0.025em;
    }

    .close-btn {
      opacity: 0;
      transform: translateY(-12px);
      transition: all var(--dur-slow) var(--spring-default) 0.12s;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      backdrop-filter: blur(12px);
    }

    #overlay.visible .close-btn {
      opacity: 1;
      transform: translateY(0);
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: var(--text-primary);
      border-color: var(--glass-border-hover);
    }

    .close-btn:active {
      transform: scale(0.88);
      transition: transform var(--dur-instant) ease-out;
    }

    /* ═══════════════════════════════════════════════════════════════
       STATUS CAPSULE (Apple Intelligence Glass Pill)
       ═══════════════════════════════════════════════════════════════ */

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      border-radius: 9999px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04));
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      margin-bottom: 16px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity var(--dur-slow) var(--spring-default) 0.18s, transform var(--dur-slow) var(--spring-default) 0.18s;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), var(--shadow-glow);
    }

    #overlay.visible .status-pill {
      opacity: 1;
      transform: translateY(0);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #818cf8;
      transition: all var(--dur-normal) ease;
      box-shadow: 0 0 10px rgba(129, 140, 248, 0.6);
    }

    .status-dot.listening {
      background: #38bdf8;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.8), 0 0 24px rgba(168, 85, 247, 0.5);
      animation: statusPulse 1.4s ease-in-out infinite;
    }

    .status-dot.thinking {
      background: #fbbf24;
      box-shadow: 0 0 14px rgba(251, 191, 36, 0.8), 0 0 24px rgba(245, 158, 11, 0.5);
      animation: statusPulse 1s ease-in-out infinite;
    }

    .status-dot.speaking {
      background: #a855f7;
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.8), 0 0 24px rgba(236, 72, 153, 0.5);
    }

    @keyframes statusPulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.38);
        opacity: 0.6;
      }
    }

    .status-text {
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.90);
      letter-spacing: 0.015em;
    }

    /* ═══════════════════════════════════════════════════════════════
       AURORA VISUALIZER
       ═══════════════════════════════════════════════════════════════ */

    #aurora-container {
      position: relative;
      width: 520px;
      height: 124px;
      margin-bottom: 20px;
      opacity: 0;
      transform: scale(0.95);
      transition: all var(--dur-slow) var(--spring-bounce) 0.22s;
    }

    #overlay.visible #aurora-container {
      opacity: 1;
      transform: scale(1);
    }

    #aurora-canvas {
      width: 100%;
      height: 100%;
      will-change: transform;
    }

    /* ═══════════════════════════════════════════════════════════════
       CAPTION AREA
       ═══════════════════════════════════════════════════════════════ */

    .caption-area {
      max-width: 520px;
      text-align: center;
      margin-bottom: 22px;
      min-height: 26px;
      opacity: 0;
      transform: translateY(8px);
      transition: all var(--dur-slow) var(--spring-default) 0.28s;
    }

    #overlay.visible .caption-area {
      opacity: 1;
      transform: translateY(0);
    }

    .caption-text {
      font-size: 15px;
      line-height: 1.6;
      letter-spacing: 0;
      color: rgba(255, 255, 255, 0.92);
      font-weight: 400;
    }

    /* ═══════════════════════════════════════════════════════════════
       INPUT BAR (Apple Liquid Glass Input)
       ═══════════════════════════════════════════════════════════════ */

    .input-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 520px;
      max-width: 90vw;
      padding: 5px 5px 5px 18px;
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      box-shadow: inset 0 1.5px 0 var(--glass-shine),
        0 8px 32px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(16px);
      transition: all var(--dur-slow) var(--spring-default) 0.32s;
    }

    #overlay.visible .input-bar {
      opacity: 1;
      transform: translateY(0);
    }

    .input-bar:focus-within {
      background: rgba(40, 40, 60, 0.45);
      border-color: rgba(168, 85, 247, 0.45);
      box-shadow: 0 0 0 2.5px rgba(99, 102, 241, 0.25),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.25),
        0 12px 36px rgba(0, 0, 0, 0.55), var(--shadow-glow);
    }

    .input-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.96);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      caret-color: #38bdf8;
    }

    .input-bar input::placeholder {
      color: var(--text-tertiary);
    }

    .input-send-btn {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      transition: all var(--dur-fast) var(--spring-default);
      box-shadow: 0 2px 10px rgba(139, 92, 246, 0.35);
      flex-shrink: 0;
    }

    .input-send-btn:hover {
      transform: scale(1.06);
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #c026d3 100%);
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.55);
    }

    .input-send-btn:active {
      transform: scale(0.88);
      transition: transform var(--dur-instant) ease-out;
    }

    /* ═══════════════════════════════════════════════════════════════
       SHORTCUT HINT
       ═══════════════════════════════════════════════════════════════ */

    .shortcut-hint {
      margin-top: 14px;
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.28);
      opacity: 0;
      transform: translateY(8px);
      transition: all var(--dur-slow) var(--spring-default) 0.36s;
    }

    #overlay.visible .shortcut-hint {
      opacity: 1;
      transform: translateY(0);
    }

    .shortcut-hint kbd {
      display: inline-block;
      padding: 1px 5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      font-size: 9.5px;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.45);
    }

    @media (max-width: 600px) {
      #aurora-container {
        width: 90vw;
      }

      .input-bar {
        width: 90vw;
      }

      .caption-area {
        max-width: 90vw;
      }

      .chat-history {
        max-width: 90vw;
      }
    }

    /* ═══════════════════════════════════════════════════════════════
       CHAT HISTORY PANEL
       ═══════════════════════════════════════════════════════════════ */

    .history-toggle-btn {
      opacity: 0;
      transform: translateY(-12px);
      transition: all var(--dur-slow) var(--spring-default) 0.12s;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      backdrop-filter: blur(12px);
      margin-right: 8px;
    }

    #overlay.visible .history-toggle-btn {
      opacity: 1;
      transform: translateY(0);
    }

    .history-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: var(--text-primary);
      border-color: var(--glass-border-hover);
    }

    .history-toggle-btn.active {
      background: rgba(99, 102, 241, 0.25);
      border-color: rgba(99, 102, 241, 0.45);
      color: #a5b4fc;
    }

    .chat-history {
      width: 520px;
      max-width: 90vw;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s var(--spring-default), opacity 0.3s ease;
      opacity: 0;
      margin-bottom: 0;
    }

    .chat-history.open {
      max-height: 320px;
      opacity: 1;
      margin-bottom: 16px;
    }

    .chat-history-scroll {
      max-height: 320px;
      overflow-y: auto;
      padding: 12px 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.12) transparent;
    }

    .chat-history-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .chat-history-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-history-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
    }

    .chat-bubble {
      max-width: 85%;
      padding: 8px 14px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.5;
      word-wrap: break-word;
      animation: bubbleIn 0.3s var(--spring-default);
    }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .chat-bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.30), rgba(139, 92, 246, 0.20));
      border: 1px solid rgba(99, 102, 241, 0.30);
      color: rgba(255, 255, 255, 0.94);
    }

    .chat-bubble.assistant {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.90);
    }

    .chat-bubble .bubble-time {
      display: block;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.30);
      margin-top: 4px;
    }

    .chat-empty {
      text-align: center;
      color: rgba(255, 255, 255, 0.25);
      font-size: 12px;
      padding: 24px 0;
    }
  </style>
</head>

<body>

  <!-- Liquid Glass lensing filter — subtly bends/warps the backdrop -->
  <svg style="position:absolute; width:0; height:0; overflow:hidden;" aria-hidden="true">
    <filter id="glass-lens" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.014" numOctaves="2" seed="7" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="3" result="softNoise" />
      <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="10" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div id="overlay" class="hidden">
    <!-- Top bar -->
    <div id="top-bar">
      <div class="top-brand">
        <div class="brand-dot"></div>
        <span class="brand-name">Wodi</span>
      </div>
      <div style="display:flex;align-items:center;gap:4px;">
        <button class="history-toggle-btn" id="history-toggle-btn" title="Chat History">⟳</button>
        <button class="close-btn" id="close-btn" title="Close (Esc)">✕</button>
      </div>
    </div>

    <!-- Status pill -->
    <div class="status-pill" id="status-pill">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-text">Ready</span>
    </div>

    <!-- Aurora Visualizer -->
    <div id="aurora-container">
      <canvas id="aurora-canvas"></canvas>
    </div>

    <!-- Chat History -->
    <div class="chat-history" id="chat-history">
      <div class="chat-history-scroll" id="chat-history-scroll">
        <div class="chat-empty" id="chat-empty">No conversation history yet</div>
      </div>
    </div>

    <!-- Caption -->
    <div class="caption-area">
      <p class="caption-text" id="caption-text"></p>
    </div>

    <!-- Input Bar -->
    <div class="input-bar">
      <input type="text" id="overlay-input" placeholder="Message Wodi... Ctrl+Space" autocomplete="off"
        spellcheck="false" />
      <button class="input-send-btn" id="overlay-send">↑</button>
    </div>

    <!-- Shortcut hint -->
    <div class="shortcut-hint">
      <kbd>Esc</kbd> close · <kbd>Ctrl</kbd>+<kbd>Space</kbd> toggle
    </div>
  </div>

  <script>
    /* ═══════════════════════════════════════════════════════════════════════════════
       WODI OVERLAY — Apple Intelligence Liquid Glass Interface Engine
       ═══════════════════════════════════════════════════════════════════════════════ */

    /* ── Spring Engine ── */
    const SpringEngine = (() => {
      const reducedMotionMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
      function toPhysical(dampingRatio, response, mass) {
        const angularFreq = (2 * Math.PI) / Math.max(response, 0.01);
        return { stiffness: mass * angularFreq * angularFreq, damping: 2 * mass * dampingRatio * angularFreq };
      }
      function animate({ from, to, velocity = 0, dampingRatio = 1, response = 0.35, mass = 1, precision = 0.01, onUpdate, onComplete }) {
        if (reducedMotionMQ.matches) { onUpdate(to, 0); onComplete && onComplete(); return { retarget(t) { onUpdate(t, 0); }, cancel() { } }; }
        const { stiffness, damping } = toPhysical(dampingRatio, response, mass);
        let pos = from, vel = velocity, target = to, raf = null, lastT = null, dead = false;
        function tick(t) {
          if (dead) return;
          if (lastT == null) lastT = t;
          let dt = Math.min((t - lastT) / 1000, 1 / 30);
          lastT = t;
          const subSteps = 2, sdt = dt / subSteps;
          for (let i = 0; i < subSteps; i++) {
            const accel = (-stiffness * (pos - target) - damping * vel) / mass;
            vel += accel * sdt; pos += vel * sdt;
          }
          onUpdate(pos, vel);
          if (Math.abs(pos - target) < precision && Math.abs(vel) < precision) {
            pos = target; vel = 0; onUpdate(pos, vel); dead = true; onComplete && onComplete(); return;
          }
          raf = requestAnimationFrame(tick);
        }
        raf = requestAnimationFrame(tick);
        return {
          retarget(newTarget, addVelocity = 0) { target = newTarget; vel += addVelocity; lastT = null; },
          get position() { return pos; }, get velocity() { return vel; },
          cancel() { dead = true; if (raf) cancelAnimationFrame(raf); },
        };
      }
      function project(velocity, decelerationRate = 0.998) { return (velocity / 1000) * decelerationRate / (1 - decelerationRate); }
      function rubberband(overshoot, dimension, constant = 0.55) { return (overshoot * dimension * constant) / (dimension + constant * Math.abs(overshoot)); }
      return { animate, project, rubberband, get reducedMotion() { return reducedMotionMQ.matches; } };
    })();

    function createVelocityTracker() {
      let hist = [];
      return {
        push(x, y) { hist.push({ x, y, t: performance.now() }); if (hist.length > 5) hist.shift(); },
        velocity() {
          if (hist.length < 2) return { vx: 0, vy: 0 };
          const a = hist[0], b = hist[hist.length - 1], dt = (b.t - a.t) / 1000;
          return dt > 0 ? { vx: (b.x - a.x) / dt, vy: (b.y - a.y) / dt } : { vx: 0, vy: 0 };
        },
        reset() { hist = []; },
      };
    }
    function hapticTick(ms = 8) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { } }

    const STATES = { IDLE: 'idle', LISTENING: 'listening', THINKING: 'thinking', SPEAKING: 'speaking' };
    let state = STATES.IDLE;
    let isVisible = false;
    let captionText = '';
    let currentUserMessage = '';   // Track the user message for the current request
    let historyOpen = false;

    // DOM
    const overlay = document.getElementById('overlay');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const captionEl = document.getElementById('caption-text');
    const inputEl = document.getElementById('overlay-input');
    const sendBtn = document.getElementById('overlay-send');
    const closeBtn = document.getElementById('close-btn');
    const historyToggleBtn = document.getElementById('history-toggle-btn');
    const chatHistoryEl = document.getElementById('chat-history');
    const chatHistoryScroll = document.getElementById('chat-history-scroll');
    const chatEmptyEl = document.getElementById('chat-empty');

    // ── Chat History (localStorage) ──
    const HISTORY_KEY = 'wodi_chat_history';
    const HISTORY_MAX = 50;

    function loadHistory() {
      try {
        const raw = localStorage.getItem(HISTORY_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) { return []; }
    }

    function saveHistory(history) {
      try {
        // Keep only the latest HISTORY_MAX entries
        const trimmed = history.slice(-HISTORY_MAX);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(trimmed));
      } catch (e) { /* quota exceeded — silent */ }
    }

    function addToHistory(role, text) {
      const history = loadHistory();
      history.push({
        role,
        text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      });
      saveHistory(history);
      renderHistory();
    }

    function renderHistory() {
      const history = loadHistory();
      chatHistoryScroll.innerHTML = '';
      if (history.length === 0) {
        chatHistoryScroll.innerHTML = '<div class="chat-empty">No conversation history yet</div>';
        return;
      }
      for (const entry of history) {
        const bubble = document.createElement('div');
        bubble.className = `chat-bubble ${entry.role}`;
        bubble.textContent = entry.text;
        const timeSpan = document.createElement('span');
        timeSpan.className = 'bubble-time';
        timeSpan.textContent = entry.time || '';
        bubble.appendChild(timeSpan);
        chatHistoryScroll.appendChild(bubble);
      }
      // Auto-scroll to bottom
      chatHistoryScroll.scrollTop = chatHistoryScroll.scrollHeight;
    }

    function toggleHistory() {
      historyOpen = !historyOpen;
      chatHistoryEl.classList.toggle('open', historyOpen);
      historyToggleBtn.classList.toggle('active', historyOpen);
      if (historyOpen) renderHistory();
    }

    historyToggleBtn.addEventListener('click', toggleHistory);

    // Load history on boot
    renderHistory();

    // Apple Intelligence Spectrum Palettes (RGB)
    const STATE_COLORS = {
      idle: { primary: [129, 140, 248], secondary: [192, 132, 252], tertiary: [96, 165, 250] },
      listening: { primary: [56, 189, 248], secondary: [244, 63, 94], tertiary: [168, 85, 247] },
      thinking: { primary: [251, 191, 36], secondary: [245, 158, 11], tertiary: [217, 119, 6] },
      speaking: { primary: [168, 85, 247], secondary: [99, 102, 241], tertiary: [236, 72, 153] },
    };

    const STATE_LABELS = {
      idle: 'Ready', listening: 'Listening', thinking: 'Processing', speaking: 'Speaking',
    };

    // Audio Feedback
    let audioCtx = null;
    function playTick(freq = 880, dur = 0.05) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value = freq; o.type = 'sine';
        g.gain.setValueAtTime(0.03, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.start(audioCtx.currentTime); o.stop(audioCtx.currentTime + dur);
      } catch (e) { }
    }

    // Show/Hide Springs
    const supportsGlassLens = (window.CSS && CSS.supports &&
      (CSS.supports('backdrop-filter', 'url(#glass-lens)') || CSS.supports('-webkit-backdrop-filter', 'url(#glass-lens)')));
    let overlayOpacitySpring = null, overlayYSpring = null, overlayBlurSpring = null;
    let overlayOpacity = 0, overlayY = 24, overlayBlur = 12;

    function paintOverlay() {
      overlay.style.opacity = String(overlayOpacity);
      overlay.style.transform = overlayY ? `translateY(${overlayY}px)` : '';
      const filterStr = `${supportsGlassLens ? 'url(#glass-lens) ' : ''}blur(${overlayBlur}px) saturate(200%)`;
      overlay.style.backdropFilter = filterStr;
      overlay.style.webkitBackdropFilter = filterStr;
    }

    function showOverlay() {
      isVisible = true;
      overlay.classList.remove('hidden');
      [overlayOpacitySpring, overlayYSpring, overlayBlurSpring].forEach(s => s && s.cancel());
      requestAnimationFrame(() => {
        overlay.classList.add('visible');
        overlayOpacitySpring = SpringEngine.animate({
          from: overlayOpacity, to: 1, dampingRatio: 1, response: 0.4,
          onUpdate: (v) => { overlayOpacity = v; paintOverlay(); }
        });
        overlayYSpring = SpringEngine.animate({
          from: overlayY, to: 0, dampingRatio: 0.86, response: 0.36,
          onUpdate: (v) => { overlayY = v; paintOverlay(); }
        });
        overlayBlurSpring = SpringEngine.animate({
          from: overlayBlur, to: 70, dampingRatio: 1, response: 0.4,
          onUpdate: (v) => { overlayBlur = v; paintOverlay(); }
        });
        inputEl.focus();
      });
    }

    function hideOverlay(velocity = 0) {
      isVisible = false;
      overlay.classList.remove('visible');
      [overlayOpacitySpring, overlayYSpring, overlayBlurSpring].forEach(s => s && s.cancel());
      overlayOpacitySpring = SpringEngine.animate({
        from: overlayOpacity, to: 0, dampingRatio: 1, response: 0.32,
        onUpdate: (v) => { overlayOpacity = v; paintOverlay(); },
        onComplete: () => { overlay.classList.add('hidden'); overlayY = 24; overlayBlur = 12; }
      });
      overlayYSpring = SpringEngine.animate({
        from: overlayY, to: 40, velocity, dampingRatio: 1, response: 0.32,
        onUpdate: (v) => { overlayY = v; paintOverlay(); }
      });
      overlayBlurSpring = SpringEngine.animate({
        from: overlayBlur, to: 16, dampingRatio: 1, response: 0.3,
        onUpdate: (v) => { overlayBlur = v; paintOverlay(); }
      });
    }

    function toggleOverlay() {
      if (isVisible) hideOverlay();
      else showOverlay();
    }

    // Liquid Glass Specular highlight
    const LIQUID_GLASS_SELECTOR = '#overlay, .input-bar, .status-pill, .close-btn';
    function ensureSpecularLayer(el) {
      let span = el.querySelector(':scope > .specular-layer');
      if (!span) {
        span = document.createElement('span');
        span.className = 'specular-layer';
        span.setAttribute('aria-hidden', 'true');
        el.appendChild(span);
      }
      return span;
    }
    function positionSpecular(span, el, clientX, clientY) {
      const r = el.getBoundingClientRect();
      span.style.setProperty('--sx', `${((clientX - r.left) / r.width) * 100}%`);
      span.style.setProperty('--sy', `${((clientY - r.top) / r.height) * 100}%`);
    }
    let liquidHoverEl = null;
    document.addEventListener('pointermove', (e) => {
      const el = e.target.closest(LIQUID_GLASS_SELECTOR);
      if (el !== liquidHoverEl) {
        if (liquidHoverEl) { const prev = liquidHoverEl.querySelector(':scope > .specular-layer'); if (prev) prev.classList.remove('specular-hover'); }
        liquidHoverEl = el;
      }
      if (!el) return;
      const span = ensureSpecularLayer(el);
      positionSpecular(span, el, e.clientX, e.clientY);
      span.classList.add('specular-hover');
    });
    document.addEventListener('pointerdown', (e) => {
      const el = e.target.closest(LIQUID_GLASS_SELECTOR);
      if (!el) return;
      const span = ensureSpecularLayer(el);
      positionSpecular(span, el, e.clientX, e.clientY);
      span.classList.add('specular-press');
    });
    document.addEventListener('pointerup', () => {
      document.querySelectorAll('.specular-layer.specular-press').forEach(s => s.classList.remove('specular-press'));
    });

    closeBtn.addEventListener('click', () => hideOverlay());

    // Pull-down-to-dismiss
    const overlayVTracker = createVelocityTracker();
    let ovDragging = false, ovPointerId = null, ovStartY = 0, ovStartTY = 0;

    function ovPointerDown(e) {
      if (e.target.closest('.input-bar, .close-btn')) return;
      ovDragging = true; ovPointerId = e.pointerId;
      ovStartY = e.clientY; ovStartTY = overlayY;
      overlayVTracker.reset(); overlayVTracker.push(e.clientX, e.clientY);
      [overlayOpacitySpring, overlayYSpring].forEach(s => s && s.cancel());
    }
    function ovPointerMove(e) {
      if (!ovDragging || e.pointerId !== ovPointerId) return;
      overlayVTracker.push(e.clientX, e.clientY);
      let dy = ovStartTY + (e.clientY - ovStartY);
      if (dy < 0) dy = SpringEngine.rubberband(dy, window.innerHeight * 0.6);
      overlayY = dy;
      overlayOpacity = Math.max(0.25, 1 - Math.abs(dy) / (window.innerHeight * 0.5));
      paintOverlay();
    }
    function ovPointerUp(e) {
      if (!ovDragging || e.pointerId !== ovPointerId) return;
      ovDragging = false;
      const { vy } = overlayVTracker.velocity();
      const projected = overlayY + SpringEngine.project(vy);
      if (projected > 120 || vy > 700) {
        hideOverlay(vy);
      } else {
        overlayYSpring = SpringEngine.animate({
          from: overlayY, to: 0, velocity: vy, dampingRatio: 0.82, response: 0.34,
          onUpdate: (v) => { overlayY = v; paintOverlay(); }
        });
        overlayOpacitySpring = SpringEngine.animate({
          from: overlayOpacity, to: 1, dampingRatio: 1, response: 0.3,
          onUpdate: (v) => { overlayOpacity = v; paintOverlay(); }
        });
      }
    }
    overlay.addEventListener('pointerdown', ovPointerDown);
    document.addEventListener('pointermove', ovPointerMove);
    document.addEventListener('pointerup', ovPointerUp);
    document.addEventListener('pointercancel', ovPointerUp);

    // State management
    function setState(newState) {
      state = newState;
      const label = STATE_LABELS[state] || 'Ready';
      statusText.textContent = label;

      statusDot.className = 'status-dot';
      if (state !== 'idle') statusDot.classList.add(state);

      overlay.className = overlay.className.replace(/state-\w+/g, '').trim();
      if (state !== 'idle') overlay.classList.add(`state-${state}`);

      const pill = document.getElementById('status-pill');
      const colors = STATE_COLORS[state] || STATE_COLORS.idle;
      const [r, g, b] = colors.primary;
      pill.style.background = `linear-gradient(135deg, rgba(${r}, ${g}, ${b}, 0.16), rgba(${r}, ${g}, ${b}, 0.05))`;
      pill.style.borderColor = `rgba(${r}, ${g}, ${b}, 0.30)`;
    }

    // Input handling
    function submitText() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';

      // ── Reset response accumulator for this new request ──
      captionText = '';
      currentUserMessage = text;

      captionEl.textContent = `You: ${text}`;
      setState(STATES.THINKING);
      playTick(960, 0.06); hapticTick(10);

      // Save user message to history
      addToHistory('user', text);

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'text_command', text }));
      } else {
        // Demo mode fallback
        setTimeout(() => {
          setState(STATES.SPEAKING);
          const demoResponse = `I'm in demo mode. Start the kernel: python -m wodi --kernel-only`;
          captionEl.textContent = demoResponse;
          addToHistory('assistant', demoResponse);
          setTimeout(() => {
            setState(STATES.IDLE);
          }, 2500);
        }, 700);
      }
    }

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submitText(); }
      if (e.key === 'Escape') { hideOverlay(); }
    });
    sendBtn.addEventListener('click', submitText);

    // Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.code === 'Space') { e.preventDefault(); toggleOverlay(); }
      if (e.key === 'Escape' && isVisible) { hideOverlay(); }
    });

    // Multicolored Apple Aurora Visualizer
    const auroraCanvas = document.getElementById('aurora-canvas');
    const ctx = auroraCanvas.getContext('2d');
    let phase = 0;
    let rms = 0;
    let targetRms = 0;

    function resizeAurora() {
      const dpr = window.devicePixelRatio || 1;
      const container = document.getElementById('aurora-container');
      auroraCanvas.width = container.clientWidth * dpr;
      auroraCanvas.height = container.clientHeight * dpr;
      ctx.scale(dpr, dpr);
    }
    resizeAurora();
    window.addEventListener('resize', resizeAurora);

    function drawAurora() {
      phase += 0.032;
      rms += (targetRms - rms) * 0.12;
      targetRms *= 0.92;

      const container = document.getElementById('aurora-container');
      const w = container.clientWidth;
      const h = container.clientHeight;
      const cx = w / 2;
      const cy = h / 2;

      ctx.clearRect(0, 0, w * 2, h * 2);

      const colors = STATE_COLORS[state] || STATE_COLORS.idle;

      const layers = [
        { alpha: 0.10, freqMult: 0.8, ampMult: 0.5, timeOff: 1.1, width: 24, rgb: colors.tertiary },
        { alpha: 0.22, freqMult: 1.1, ampMult: 0.7, timeOff: 0.6, width: 12, rgb: colors.secondary },
        { alpha: 0.45, freqMult: 1.4, ampMult: 0.9, timeOff: 0.2, width: 5, rgb: colors.primary },
        { alpha: 0.78, freqMult: 1.8, ampMult: 1.0, timeOff: 0.0, width: 2.5, rgb: colors.primary },
      ];

      for (const layer of layers) {
        const t = phase + layer.timeOff;
        const [r, g, b] = layer.rgb;
        const points = [];
        const numPoints = 90;

        for (let i = 0; i <= numPoints; i++) {
          const nx = i / numPoints;
          const x = nx * w;

          let amp;
          if (state === 'idle') amp = 5 + rms * 7;
          else if (state === 'listening') amp = 16 + rms * 45;
          else if (state === 'thinking') amp = 10 + 7 * Math.sin(t * 2.4);
          else if (state === 'speaking') amp = 18 + rms * 50;
          else amp = 5;

          amp *= layer.ampMult;

          const freq = layer.freqMult;
          const wave =
            Math.sin(nx * Math.PI * 2.8 * freq + t * 2.0) * amp +
            Math.sin(nx * Math.PI * 4.2 * freq - t * 1.5) * amp * 0.5 +
            Math.sin(nx * Math.PI * 6.8 * freq + t * 3.0) * amp * 0.25 +
            Math.sin(nx * Math.PI * 1.2 * freq + t * 0.8) * amp * 0.4;

          const envelope = Math.pow(Math.sin(nx * Math.PI), 1.5);
          const y = cy + wave * envelope;

          points.push({ x, y });
        }

        // Fill band
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length - 1; i++) {
          const mx = (points[i].x + points[i + 1].x) / 2;
          const my = (points[i].y + points[i + 1].y) / 2;
          ctx.quadraticCurveTo(points[i].x, points[i].y, mx, my);
        }
        ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);

        for (let i = points.length - 1; i >= 0; i--) {
          const mirrorY = cy - (points[i].y - cy);
          ctx.lineTo(points[i].x, mirrorY);
        }
        ctx.closePath();

        const grad = ctx.createLinearGradient(0, cy, w, cy);
        grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${layer.alpha * 0.3})`);
        grad.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${layer.alpha})`);
        grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, ${layer.alpha * 0.3})`);
        ctx.fillStyle = grad;
        ctx.fill();

        // Top wave stroke
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length - 1; i++) {
          const mx = (points[i].x + points[i + 1].x) / 2;
          const my = (points[i].y + points[i + 1].y) / 2;
          ctx.quadraticCurveTo(points[i].x, points[i].y, mx, my);
        }
        ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
        ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${Math.min(1, layer.alpha * 1.5)})`;
        ctx.lineWidth = layer.width;
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      // Center radial glow
      const [pr, pg, pb] = colors.primary;
      const glowR = 26 + rms * 22;
      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
      glow.addColorStop(0, `rgba(${pr}, ${pg}, ${pb}, 0.28)`);
      glow.addColorStop(1, `rgba(${pr}, ${pg}, ${pb}, 0)`);
      ctx.fillStyle = glow;
      ctx.fillRect(cx - glowR, cy - glowR, glowR * 2, glowR * 2);

      requestAnimationFrame(drawAurora);
    }

    // WebSocket Connection
    let ws = null;
    function connectWs() {
      try {
        ws = new WebSocket('ws://localhost:8765');
        ws.onopen = () => { setState(STATES.IDLE); };
        ws.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          if (msg.type === 'wake') { showOverlay(); setState(STATES.LISTENING); }
          else if (msg.type === 'thinking') {
            // Reset accumulator when kernel signals thinking on a new request
            captionText = '';
            setState(STATES.THINKING);
          }
          else if (msg.type === 'response_chunk') {
            setState(STATES.SPEAKING);
            captionText += msg.chunk;
            captionEl.textContent = captionText.slice(-200);
            targetRms = 0.55;
          }
          else if (msg.type === 'response_complete') {
            // Save the full response to history
            if (captionText.trim()) {
              addToHistory('assistant', captionText.trim());
            }
            setState(STATES.IDLE);
            // Keep the response visible for 4s, then clear
            setTimeout(() => {
              captionText = '';
              captionEl.textContent = '';
            }, 4000);
          }
        };
        ws.onclose = () => { ws = null; setTimeout(connectWs, 3000); };
        ws.onerror = () => { ws = null; };
      } catch (e) { /* silent */ }
    }

    // Boot
    drawAurora();
    connectWs();
    setTimeout(() => showOverlay(), 300);
  </script>
</body>

</html>
